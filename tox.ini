[tox]
envlist = py311,py312,py313,py314,py315,pypy3,flake8,black,mypy,docs

[testenv]
extras = tests
commands =
    coverage run -m pytest -m "not acceptance"
    coverage report
    coverage xml
    pytest -m "acceptance"

[testenv:black]
basepython = python3.15
deps=
    black
commands={envbindir}/black --check lunr tests

[testenv:flake8]
basepython = python3.15
deps=
    flake8
commands={envbindir}/flake8 lunr tests

[testenv:docs]
basepython = python3.15
extras = docs
commands={envbindir}/sphinx-build docs docs/_build/html

[testenv:mypy]
basepython = python3.15
deps = mypy
commands={envbindir}/mypy lunr

[flake8]
exclude = lunr/stemmer.py
max-line-length = 92
ignore = E203 W503

[pytest]
markers =
    acceptance: mark test as an acceptance test

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315,flake8,black,docs,mypy
    pypy3: pypy3
